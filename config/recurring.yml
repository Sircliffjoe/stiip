# Solid Queue recurring schedule for automated data synchronization

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  sync_stock_prices:
    class: SyncPricesJob
    queue: default
    schedule: "every weekday at 6pm"
    description: "Daily EOD stock price sync after market close"

  sync_dividends:
    class: SyncDividendsJob
    queue: default
    schedule: "every weekday at 7pm"
    description: "Daily dividend announcements sync"

  sync_news:
    class: SyncNewsJob
    queue: default
    schedule: "every 2 hours"
    description: "Periodic market news sync"

  generate_alerts:
    class: GenerateAlertsJob
    queue: default
    schedule: "every weekday at 6:30pm"
    description: "Generate watchlist-based alerts after price sync"

  subscription_renewal_reminders:
    class: SubscriptionRenewalReminderJob
    queue: default
    schedule: "every day at 9am"
    description: "Email paid users one month before subscription expiration"

development:
  sync_stock_prices:
    class: SyncPricesJob
    queue: default
    schedule: "every 30 minutes"

  generate_alerts:
    class: GenerateAlertsJob
    queue: default
    schedule: "every 30 minutes"

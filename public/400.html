<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>400 — Bad Request | NoraCapital</title>
  <link rel="icon" href="/icon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #030712;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      text-align: center;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.15), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(17, 24, 39, 0.5), transparent 50%);
    }
    .card {
      max-width: 32rem;
      width: 100%;
      background-color: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(55, 65, 81, 0.7);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .code {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, #60a5fa 30%, #2563eb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }
    p {
      color: #9ca3af;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.625rem;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background-color: #1e3a8a;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3);
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background-color: rgba(31, 41, 55, 0.8);
      color: #d1d5db;
      border: 1px solid #374151;
    }
    .btn-secondary:hover {
      background-color: #374151;
      color: #ffffff;
    }
    .brand {
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    .brand img {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.5rem;
    }
    .brand span {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.025em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="/icon.png" alt="NoraCapital Logo">
      <span>NoraCapital</span>
    </div>

    <div class="code">400</div>
    <h1>Bad Request</h1>
    <p>The request parameters sent to our servers were invalid or malformed. Please check your request and try again.</p>

    <div class="btn-group">
      <a href="/" class="btn btn-primary">
        &larr; Return Home
      </a>
    </div>
  </div>
</body>
</html>
